# RiskConfig — owner-set values (OI-07: 11 rules are fixed; values are tunable).
# Agents have NO write access to this file (SECURITY_MODEL.md).
max_position_size: 1000.0
max_daily_loss: 200.0
max_drawdown: 0.10
exposure_limit: 5000.0
leverage_limit: 5.0
require_stop_loss: true
require_take_profit: true
max_correlation: 0.8
max_portfolio_exposure: 10000.0
trading_sessions:
  - "00:00-23:59"
kill_switch: false
max_reevaluate_cycles: 3
