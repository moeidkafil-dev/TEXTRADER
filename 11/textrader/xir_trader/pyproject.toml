[project]
name = "xir-trader"
version = "0.1.0"
description = "TRADER / XIR reference runtime (paper-mode reference implementation)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
xir-trader = "xir_trader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
