# TRADER (XIR) — Python runtime
# Reference implementation of the TRADER/XIR agent trading system.
# Owner/Inventor: Moeid Kafilonas — Brand: XIR
# Python 3.12+

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-xir"
version = "1.0.0"
description = "TRADER/XIR — chain-of-agents autonomous trading runtime (paper-first, invariants-enforced)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Moeid Kafilonas"}
]
license = {text = "Proprietary"}
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
trader-paper = "trader.scripts.run_paper:main"
trader-backtest = "trader.scripts.run_backtest:main"
trader-demo = "trader.scripts.run_demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"
