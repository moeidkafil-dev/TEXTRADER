<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>textrader Control Center</title>
<style>
:root{--bg:#071018;--panel:#0d1822;--panel2:#111f2c;--line:#203342;--text:#e9f1f7;--muted:#8ea4b5;--green:#40d99a;--red:#ff6b7a;--amber:#ffc857;--blue:#62b0ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#061019,#0a141d);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;justify-content:space-between;background:#08131cdd;backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.12em}.status{display:flex;gap:14px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}.wrap{max-width:1500px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}select,input,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px}button{cursor:pointer}button:hover{border-color:#416074}.grid{display:grid;grid-template-columns:1.8fr 1fr;gap:16px}.panel{background:linear-gradient(180deg,#0d1923,#0b151e);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 40px #0003}.title{display:flex;justify-content:space-between;margin-bottom:12px}.title b{font-size:13px}.muted{color:var(--muted)}.price{font-size:32px;font-weight:800}.up{color:var(--green)}.down{color:var(--red)}canvas{width:100%;height:380px;display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric{font-size:23px;font-weight:750}.decision{font-size:25px;font-weight:800}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1b2a35}.pill{padding:4px 8px;border-radius:999px;background:#132531;color:var(--muted)}.pass{color:var(--green)}.fail{color:var(--red)}.warn{color:var(--amber)}pre{white-space:pre-wrap;max-height:280px;overflow:auto;color:#a9bfd0}@media(max-width:900px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><header><div class="brand">TRADER / XIR</div><div class="status"><span><i class="dot"></i> SYSTEM ONLINE</span><span id="mode">PAPER</span><span id="clock" class="muted"></span></div></header>
<div class="wrap"><div class="toolbar"><input id="symbol" value="BTC/USDT"/><select id="interval"><option>1m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option></select><button onclick="refresh()">Refresh</button><button onclick="analyze()">Run XIR Cycle</button><button onclick="kill(true)">KILL SWITCH</button><button onclick="kill(false)">Resume</button></div>
<div class="cards"><div class="panel"><div class="muted">LAST</div><div class="metric" id="last">—</div></div><div class="panel"><div class="muted">24H CHANGE</div><div class="metric" id="change">—</div></div><div class="panel"><div class="muted">BID / ASK</div><div class="metric" id="spread">—</div></div><div class="panel"><div class="muted">SYSTEM</div><div class="metric" id="health">—</div></div></div>
<div class="grid"><section class="panel"><div class="title"><b>MARKET</b><span id="updated" class="muted">—</span></div><canvas id="chart"></canvas></section><aside class="panel"><div class="title"><b>XIR DECISION</b><span id="cycle" class="pill">idle</span></div><div class="decision" id="decision">WAIT</div><p id="reason" class="muted">Run a cycle to inspect the current XIR decision.</p><div class="rows" id="risk"></div></aside></div>
<div style="height:16px"></div><section class="panel"><div class="title"><b>RAW CYCLE / AUDIT OUTPUT</b></div><pre id="raw">No cycle executed.</pre></section></div>
<script>
const $=id=>document.getElementById(id);function fmt(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:4})}
async function api(u,o){const r=await fetch(u,o);return r.json()}
async function refresh(){const s=$('symbol').value.trim();const i=$('interval').value;try{const d=await api(`/api/market?symbol=${encodeURIComponent(s)}&interval=${i}&limit=100`);if(d.error)throw Error(d.error);const t=d.ticker;$('last').textContent=fmt(t.lastPrice);$('change').textContent=fmt(t.priceChangePercent)+'%';$('change').className='metric '+(Number(t.priceChangePercent)>=0?'up':'down');$('spread').textContent=fmt(t.bidPrice)+' / '+fmt(t.askPrice);$('updated').textContent=new Date().toLocaleTimeString();draw(d.klines)}catch(e){$('health').textContent='DATA ERROR';$('raw').textContent=e}}
function draw(k){const c=$('chart'),x=c.getContext('2d'),w=c.clientWidth*devicePixelRatio,h=c.clientHeight*devicePixelRatio;c.width=w;c.height=h;x.clearRect(0,0,w,h);if(!k?.length)return;const vals=k.map(z=>+z[4]),mn=Math.min(...vals),mx=Math.max(...vals),pad=35;const px=j=>pad+j*(w-2*pad)/(vals.length-1),py=v=>h-pad-(v-mn)*(h-2*pad)/(mx-mn||1);x.lineWidth=2;x.strokeStyle='#62b0ff';x.beginPath();vals.forEach((v,j)=>j?x.lineTo(px(j),py(v)):x.moveTo(px(j),py(v)));x.stroke();x.fillStyle='#8ea4b5';x.font='12px system-ui';x.fillText(fmt(mx),8,18);x.fillText(fmt(mn),8,h-8)}
async function analyze(){const s=$('symbol').value.trim();$('decision').textContent='RUNNING…';const d=await api(`/api/analyze?symbol=${encodeURIComponent(s)}`);$('raw').textContent=JSON.stringify(d,null,2);$('cycle').textContent=d.cycle_id||'error';$('decision').textContent=d.final?.decision||'WAIT';$('reason').textContent=d.final?.reason||d.errors?.join(', ')||'No decision';const rules=d.risk?.rules||[];$('risk').innerHTML=rules.map(r=>`<div class="row"><span>${r.rule}</span><span class="${r.passed?'pass':'fail'}">${r.passed?'PASS':'BLOCK'}</span></div>`).join('');await health()}
async function kill(on){const d=await api(on?'/api/kill-switch/on':'/api/kill-switch/off',{method:'POST'});$('raw').textContent=JSON.stringify(d,null,2);await health()}
async function health(){const d=await api('/api/health');$('health').textContent=d.kill_switch.active?'HALTED':'ONLINE';$('health').className='metric '+(d.kill_switch.active?'fail':'up');$('mode').textContent=d.kill_switch.active?'HALTED':'PAPER'}
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString(),1000);setInterval(refresh,15000);refresh();health();
</script></body></html>
