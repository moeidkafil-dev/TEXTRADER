[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-xir"
version = "1.1.0"
description = "TRADER/XIR — paper-first chain-of-agents trading runtime with deterministic risk controls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
]

[project.scripts]
trader-paper = "trader.scripts.run_paper:main"
trader-backtest = "trader.scripts.run_backtest:main"
trader-demo = "trader.scripts.run_demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --tb=short"
